name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # permet de relancer la CI à la main depuis l'onglet Actions
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # bornes déclarées dans pyproject.toml (requires-python = ">=3.11")
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer le package et ses dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lancer la suite de tests
        # les tests sont hors ligne (aucun appel au feed CBOE) : rien à mocker
        run: pytest tests/ -q

      - name: Vérifier que le package se construit
        run: |
          pip install build
          python -m build --wheel
