[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gex-dashboard"
version = "0.1.0"
description = "Analyse Gamma/Delta Exposure (SPX, NDX, SPY, QQQ) à partir des chaînes d'options publiques CBOE — outil d'analyse, pas de trading."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Darthreign" }]
keywords = ["gex", "gamma-exposure", "delta-exposure", "options", "cboe", "spotgamma", "market-structure", "0dte", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Dash",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.33.0",
    "pandas>=2.2",
    "pyarrow>=23.0.1",
    "numpy>=2.0",
    "scipy>=1.14",
    "dash>=2.18",
    "plotly>=5.24",
    "apscheduler>=3.10",
    # <2.0 : la 2.0.0 a retiré/déplacé mcp.server.fastmcp, dont dépend
    # gex/mcp_server.py. Sans cette borne, une install fraîche (CI, nouveau
    # poste) récupère la 2.0 et casse la collecte des tests. Migration vers
    # l'API mcp 2.x à traiter séparément.
    "mcp>=1.28.1,<2.0",
    "websockets>=13.0",
    "waitress>=3.0.1",
    # serveur ASGI par défaut (gex/asgi.py) : SSE asynchrones, Dash via a2wsgi
    "uvicorn>=0.30",
    "starlette>=1.3.1",
    "a2wsgi>=1.10",
    # planchers de sécurité des dépendances indirectes exposées (2026-10-23) :
    # versions corrigées des failles connues, cf. requirements.txt
    "flask>=3.1.3",
    "werkzeug>=3.1.9",
    "jinja2>=3.1.6",
    "urllib3>=2.8.0",
    "certifi>=2026.10.19",
    "idna>=3.15",
    "h11>=0.16.0",
    "anyio>=4.14.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3"]
# Export des graphiques en PNG (endpoint /api/v1/<sym>/chart/<name>.png, utilisé
# par le bot Discord). Optionnel : sans kaleido l'endpoint renvoie 404 proprement
# et le reste du dashboard fonctionne. À installer sur la machine du dashboard
# qui alimente le bot : pip install ".[charts]".
charts = ["kaleido"]

[project.urls]
Homepage = "https://github.com/Darthreign/gex-dashboard"
Repository = "https://github.com/Darthreign/gex-dashboard"
Issues = "https://github.com/Darthreign/gex-dashboard/issues"

[project.scripts]
gex-dashboard = "gex.run:main"
gex-mcp = "gex.mcp_server:main"

[tool.setuptools]
packages = ["gex"]

[tool.setuptools.package-data]
# CSS et page FAQ : servis par Dash, ils doivent voyager avec le code.
# data/ et logs/ n'y sont pas — ils se créent dans le dossier de travail.
gex = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
